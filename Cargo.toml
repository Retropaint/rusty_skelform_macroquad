[package]
name = "rusty_skelform_macroquad"
version = "0.8.1"
edition = "2021"
description = "SkelForm Macroquad runtime"
license = "MIT"

[dependencies]
macroquad = "0.4.14"
quad-gl = "0.2.13"
# rusty_skelform = { path = "../rusty_skelform" }
